<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Focus areas: filters, tone mapping and visualization">
  <defs>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/><stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <!-- card 1 : filters -->
    <rect x="20" y="14" width="374" height="202" rx="16" fill="#161D2E" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="374" y="60" text-anchor="end" font-size="42" font-weight="800" fill="#FFFFFF" fill-opacity="0.07">01</text>
    <rect x="46" y="42" width="30" height="3" rx="1.5" fill="url(#accent1)"/>
    <g fill="#C7D2FE" fill-opacity="0.22">
      <rect x="46" y="64" width="11" height="11" rx="2"/><rect x="60" y="64" width="11" height="11" rx="2"/><rect x="74" y="64" width="11" height="11" rx="2"/>
      <rect x="46" y="78" width="11" height="11" rx="2"/><rect x="74" y="78" width="11" height="11" rx="2"/>
      <rect x="46" y="92" width="11" height="11" rx="2"/><rect x="60" y="92" width="11" height="11" rx="2"/><rect x="74" y="92" width="11" height="11" rx="2"/>
    </g>
    <rect x="60" y="78" width="11" height="11" rx="2" fill="#22D3EE"/>
    <text x="46" y="140" font-size="26" font-weight="700" fill="#F1F5F9">Filters</text>
    <text x="46" y="166" font-size="13.5" fill="#9AA8BE">Gaussian · Sobel · Laplacian · Canny</text>
    <path d="M 46 182 L 368 182" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="46" y="202" font-size="11" font-weight="600" letter-spacing="2.2" fill="#67E8F9">SPATIAL DOMAIN</text>

    <!-- card 2 : tone mapping -->
    <rect x="413" y="14" width="374" height="202" rx="16" fill="#161D2E" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="767" y="60" text-anchor="end" font-size="42" font-weight="800" fill="#FFFFFF" fill-opacity="0.07">02</text>
    <rect x="439" y="42" width="30" height="3" rx="1.5" fill="url(#accent2)"/>
    <g fill="#A5B4FC" fill-opacity="0.75">
      <rect x="439" y="88" width="9" height="14" rx="2"/><rect x="452" y="78" width="9" height="24" rx="2"/>
      <rect x="465" y="66" width="9" height="36" rx="2"/><rect x="478" y="82" width="9" height="20" rx="2"/>
      <rect x="491" y="72" width="9" height="30" rx="2"/>
    </g>
    <text x="439" y="140" font-size="26" font-weight="700" fill="#F1F5F9">Tone Mapping</text>
    <text x="439" y="166" font-size="13.5" fill="#9AA8BE">CLAHE · Laplacian Pyramid · LTM</text>
    <path d="M 439 182 L 761 182" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="439" y="202" font-size="11" font-weight="600" letter-spacing="2.2" fill="#A5B4FC">DYNAMIC RANGE</text>

    <!-- card 3 : visualization -->
    <rect x="806" y="14" width="374" height="202" rx="16" fill="#161D2E" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="1160" y="60" text-anchor="end" font-size="42" font-weight="800" fill="#FFFFFF" fill-opacity="0.07">03</text>
    <rect x="832" y="42" width="30" height="3" rx="1.5" fill="url(#accent3)"/>
    <path d="M 832 94 L 848 78 L 864 88 L 880 68 L 896 82" fill="none" stroke="#F472B6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#F9A8D4">
      <circle cx="832" cy="94" r="3"/><circle cx="848" cy="78" r="3"/><circle cx="864" cy="88" r="3"/><circle cx="880" cy="68" r="3"/><circle cx="896" cy="82" r="3"/>
    </g>
    <text x="832" y="140" font-size="26" font-weight="700" fill="#F1F5F9">Visualization</text>
    <text x="832" y="166" font-size="13.5" fill="#9AA8BE">Kernels · Intermediate results · Compare</text>
    <path d="M 832 182 L 1154 182" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="832" y="202" font-size="11" font-weight="600" letter-spacing="2.2" fill="#F9A8D4">MAKE IT VISIBLE</text>
  </g>
</svg>
